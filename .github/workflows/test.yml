name: Test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      force:
        description: Test even if nothing changed
        type: boolean
        default: false
  schedule:
    # looks for new commits on the SvelteKit pull request
    - cron: '23 * * * *'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # runs code from the SvelteKit pull request, which nobody reviewed for this repository, so it
  # gets no credentials that can write to it
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Update to the latest commit of the SvelteKit pull request
        id: update
        if: github.event_name != 'pull_request'
        run: node scripts/update.js >> "$GITHUB_OUTPUT"

      # the tests only run if this repository or the pull request changed since they last ran.
      # A cache entry named after the files records that they were tested
      - name: Identify the files to test
        id: before
        run: scripts/key.sh >> "$GITHUB_OUTPUT"

      - name: Look for an earlier run with the same files
        id: tested
        uses: actions/cache/restore@v6
        with:
          path: .tested
          key: ${{ steps.before.outputs.key }}
          lookup-only: true

      - name: Decide whether to test
        id: decide
        run: echo "run=${{ inputs.force == true || steps.tested.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.decide.outputs.run == 'true'
        run: |
          pnpm install ${{ steps.update.outputs.changed == 'true' && '--no-frozen-lockfile' || '--frozen-lockfile' }}
          pnpm exec playwright install --with-deps chromium
          cp .dev.vars.example .dev.vars

      - name: Test
        id: test
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: pnpm test

      - name: Summarise
        if: steps.decide.outputs.run == 'true'
        run: cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: .test-report/results.json
          include-hidden-files: true

      # after the install, which changes the lockfile when the pull request changed
      - name: Identify the files that were tested
        id: after
        if: steps.decide.outputs.run == 'true'
        run: |
          scripts/key.sh >> "$GITHUB_OUTPUT"
          touch .tested

      - name: Record that these files were tested
        if: steps.decide.outputs.run == 'true' && steps.after.outputs.key != steps.tested.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: .tested
          key: ${{ steps.after.outputs.key }}

      - name: Fail if a test failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # commits the update and the results. It never runs the packages' code, and treats what the
  # test job hands it as untrusted
  commit:
    needs: test
    # runs whether or not the tests passed
    if: always() && needs.test.outputs.run == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # redo the update here rather than take package.json and the lockfile from the test job
      - name: Pin the commit that was tested
        env:
          SHA: ${{ needs.test.outputs.sha }}
        run: |
          node scripts/update.js "$SHA"
          pnpm install --lockfile-only --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: results
          path: ${{ runner.temp }}/results

      # scripts/render.js only lets statuses, plain test titles and a code block through
      - name: Render the results
        env:
          RESULTS: ${{ runner.temp }}/results/results.json
        run: |
          test -f "$RESULTS" && test ! -L "$RESULTS" && test "$(wc -c < "$RESULTS")" -lt 100000
          node scripts/render.js "$RESULTS"

      - name: Commit
        run: |
          git add package.json pnpm-lock.yaml RESULTS.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test sveltejs/kit@$(node -e "import('./scripts/packages.js').then((m) => console.log(m.pinned_sha().slice(0, 9)))")"
          git push
